<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d111f" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <radialGradient id="ambient-cyan" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-left" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="banner-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d1f7ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="core-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-core {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px #00f0ff); }
    }
    @keyframes blink-status {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes trace-flow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .hud-title {
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: 5px;
      fill: url(#name-grad);
    }
    .hud-subtitle {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 1.5px;
      fill: #00f0ff;
    }
    .hud-mono {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 11px;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', monospace;
      font-size: 10.5px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .chip-text {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      font-weight: 600;
      fill: #00f0ff;
      letter-spacing: 1px;
    }
    .status-dot {
      animation: blink-status 1.8s infinite ease-in-out;
    }
    .core-pulse {
      transform-origin: 790px 140px;
      animation: pulse-core 3s infinite ease-in-out;
    }
  </style>

  <g filter="url(#soft-shadow)">
    <rect x="8" y="8" width="984" height="264" rx="16" fill="url(#bg-grad)" stroke="url(#banner-border)" stroke-width="1.5" />
    <rect x="8" y="8" width="984" height="264" rx="16" fill="url(#dot-grid)" />
    <rect x="8" y="8" width="984" height="264" rx="16" fill="url(#ambient-cyan)" />
    <rect x="8" y="8" width="984" height="264" rx="16" fill="url(#ambient-left)" />
  </g>

  <g stroke="#00f0ff" stroke-width="2" stroke-linecap="round">
    <path d="M 22 34 L 22 22 L 34 22" />
    <path d="M 978 34 L 978 22 L 966 22" />
    <path d="M 22 246 L 22 258 L 34 258" />
    <path d="M 978 246 L 978 258 L 966 258" />
  </g>

  <g transform="translate(48, 46)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#2ea043" class="status-dot" />
    <text x="26" y="16" class="hud-mono" fill="#e6edf3" font-weight="600">SYS://ARM64_OPTIMIZED</text>
    <text x="175" y="16" class="hud-mono" fill="#58a6ff">ONLINE</text>
  </g>

  <text x="48" y="118" class="hud-title">KEPALA LUWENG</text>
  <text x="50" y="148" class="hud-subtitle">ANDROID KERNEL &amp; LOW-LEVEL SYSTEMS ARCHITECT</text>

  <g transform="translate(50, 178)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="128" height="26" rx="6" fill="#161b26" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
      <text x="64" y="17" text-anchor="middle" class="badge-text" fill="#00f0ff">Linux 4.14+ ARM64</text>
    </g>
    <g transform="translate(138, 0)">
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#161b26" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
      <text x="69" y="17" text-anchor="middle" class="badge-text" fill="#d8b4fe">SuSFS &amp; KernelSU</text>
    </g>
    <g transform="translate(286, 0)">
      <rect x="0" y="0" width="122" height="26" rx="6" fill="#161b26" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="61" y="17" text-anchor="middle" class="badge-text" fill="#7dd3fc">Clang • ThinLTO</text>
    </g>
    <g transform="translate(418, 0)">
      <rect x="0" y="0" width="144" height="26" rx="6" fill="#161b26" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
      <text x="72" y="17" text-anchor="middle" class="badge-text" fill="#6ee7b7">Systemless Engine</text>
    </g>
  </g>

  <g transform="translate(50, 235)" class="hud-mono">
    <text x="0" y="0" fill="#484f58">LOC: aarch64-linux-android</text>
    <text x="180" y="0" fill="#484f58">|</text>
    <text x="195" y="0" fill="#484f58">SCHED: Microsecond Precision</text>
    <text x="385" y="0" fill="#484f58">|</text>
    <text x="400" y="0" fill="#58a6ff">BUILD: CLOUD_RUNNER_SECURE</text>
  </g>

  <g transform="translate(790, 140)">
    <circle cx="0" cy="0" r="95" stroke="#30363d" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
    <circle cx="0" cy="0" r="78" stroke="#00f0ff" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="62" stroke="#7928ca" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.7" />

    <line x1="-120" y1="0" x2="-62" y2="0" stroke="#00f0ff" stroke-width="1.5" opacity="0.5" />
    <line x1="62" y1="0" x2="130" y2="0" stroke="#00f0ff" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="-105" x2="0" y2="-62" stroke="#7928ca" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="62" x2="0" y2="105" stroke="#7928ca" stroke-width="1.5" opacity="0.5" />

    <path d="M -85 -45 L -140 -45 L -165 -70" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.4" />
    <circle cx="-165" cy="-70" r="2.5" fill="#00f0ff" />
    <text x="-160" y="-76" class="chip-text" fill="#8b949e">BUS_VFS</text>

    <path d="M -85 45 L -130 45 L -155 70" stroke="#a855f7" stroke-width="1" fill="none" opacity="0.4" />
    <circle cx="-155" cy="70" r="2.5" fill="#a855f7" />
    <text x="-150" y="82" class="chip-text" fill="#8b949e">IRQ_SCHED</text>

    <path d="M 85 -45 L 125 -45 L 145 -65" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.4" />
    <circle cx="145" cy="-65" r="2.5" fill="#00f0ff" />
    <text x="110" y="-72" class="chip-text" fill="#8b949e">MMU_ARM64</text>

    <path d="M 85 45 L 125 45 L 145 65" stroke="#a855f7" stroke-width="1" fill="none" opacity="0.4" />
    <circle cx="145" cy="65" r="2.5" fill="#a855f7" />
    <text x="115" y="77" class="chip-text" fill="#8b949e">SuSFS_SEC</text>

    <rect x="-46" y="-46" width="92" height="92" rx="10" fill="url(#chip-grad)" stroke="#00f0ff" stroke-width="1.5" filter="url(#soft-shadow)" />

    <rect x="-38" y="-38" width="76" height="76" rx="6" fill="#090d15" stroke="#7928ca" stroke-width="1" />

    <g class="core-pulse">
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#core-glow-grad)" opacity="0.2" />
      <rect x="-20" y="-20" width="40" height="40" rx="3" fill="#0d1117" stroke="#00f0ff" stroke-width="1.5" />
      <circle cx="0" cy="0" r="10" fill="#00f0ff" opacity="0.9" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <text x="0" y="32" text-anchor="middle" class="chip-text">OCTA-CORE</text>
  </g>
</svg>
